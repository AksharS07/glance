<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Island Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img class="logo" src="icon128.png" alt="Logo">
    <div class="header-text">
      <h2 class="title">Dynamic Island</h2>
      <span class="version">v1.6</span>
    </div>
  </div>

  <div id="now-playing" class="section card now-playing-card">
    <div class="np-content">
      <div class="np-art-container">
        <img id="np-art" src="" alt="">
        <div id="np-placeholder" class="np-placeholder">🎵</div>
      </div>
      <div class="np-info">
        <div id="np-title" class="np-title">No media playing</div>
        <div id="np-artist" class="np-artist" style="display: none;"></div>
        <div id="quick-launch" class="quick-launch">
          <div id="ql-yt" class="ql-icon" title="YouTube"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg></div>
          <div id="ql-ytm" class="ql-icon" title="YouTube Music"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg></div>
          <div id="ql-spot" class="ql-icon" title="Spotify"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.54.659.301 1.02zm1.44-3.3c-.301.42-.84.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.781-.18-.6.18-1.2.78-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.56.3z"/></svg></div>
          <div id="ql-am" class="ql-icon" title="Apple Music"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm3.684 15.111a1.47 1.47 0 0 1-1.47 1.47 1.47 1.47 0 0 1-1.47-1.47V9.757l-4.5 1.258v4.626a1.47 1.47 0 0 1-1.47 1.47 1.47 1.47 0 0 1-1.47-1.47c0-.812.658-1.47 1.47-1.47a1.458 1.458 0 0 1 .892.308V8.126a.5.5 0 0 1 .37-.482l5.5-1.5a.5.5 0 0 1 .63.482v10.485z"/></svg></div>
        </div>
      </div>
      <button id="np-playpause" class="np-btn" disabled>▶</button>
    </div>
  </div>

  <div id="popup-onboarding" class="section card" style="background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3); display: none;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
      <h3 style="margin: 0; color: #fff; font-size: 13px;">✨ New Features</h3>
      <button id="dismiss-popup-onboarding" style="background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; padding: 0;">✕</button>
    </div>
    <p style="margin: 0; font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.4;">
      <strong>Free Placement:</strong> Drag the island anywhere.<br>
      <strong>Hide Island:</strong> Hover and click X to dismiss it.<br>
      <strong>Lyrics Engine:</strong> Swap providers in the lyrics menu!
    </p>
  </div>

  <div class="section card">
    <h3>General</h3>
    <div class="setting-row">
      <label for="hideYouTube">Hide on YouTube</label>
      <label class="switch">
        <input type="checkbox" id="hideYouTube">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <label for="hideYouTubeMusic">Hide on YT Music</label>
      <label class="switch">
        <input type="checkbox" id="hideYouTubeMusic">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <label for="hideSpotify">Hide on Spotify</label>
      <label class="switch">
        <input type="checkbox" id="hideSpotify">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <label for="hideAppleMusic">Hide on Apple Music</label>
      <label class="switch">
        <input type="checkbox" id="hideAppleMusic">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section card">
    <h3>Features</h3>
    <div class="setting-row">
      <label for="enableLyrics">Enable Lyrics Engine</label>
      <label class="switch">
        <input type="checkbox" id="enableLyrics">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section card">
    <h3>Quick Playlists</h3>
    <div id="playlists-container">
      <div class="playlist-row">
        <input type="text" id="pl-name-0" placeholder="Name" class="pl-input name">
        <input type="text" id="pl-url-0" placeholder="URL" class="pl-input url">
        <button id="pl-go-0" class="pl-btn">↗</button>
      </div>
      <div class="playlist-row">
        <input type="text" id="pl-name-1" placeholder="Name" class="pl-input name">
        <input type="text" id="pl-url-1" placeholder="URL" class="pl-input url">
        <button id="pl-go-1" class="pl-btn">↗</button>
      </div>
      <div class="playlist-row">
        <input type="text" id="pl-name-2" placeholder="Name" class="pl-input name">
        <input type="text" id="pl-url-2" placeholder="URL" class="pl-input url">
        <button id="pl-go-2" class="pl-btn">↗</button>
      </div>
    </div>
    <button id="save-playlists" class="save-btn">Save</button>
  </div>

  <div class="section card">
    <h3>Position Presets</h3>
    <div class="setting-row">
      <label for="freePlacement">Free Placement (Drag anywhere)</label>
      <label class="switch">
        <input type="checkbox" id="freePlacement">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row" style="margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px;">
      <label for="presetPlacement">Preset Placement Mode</label>
      <label class="switch">
        <input type="checkbox" id="presetPlacement">
        <span class="slider"></span>
      </label>
    </div>
    <div class="preset-grid">
      <button class="preset-btn" id="preset-top" title="Top Center">
        <div class="preset-icon"><div class="dot top"></div></div>
        Top
      </button>
      <button class="preset-btn" id="preset-bottom" title="Bottom Center">
        <div class="preset-icon"><div class="dot bottom"></div></div>
        Bottom
      </button>
      <button class="preset-btn" id="preset-left" title="Left Center">
        <div class="preset-icon"><div class="dot left"></div></div>
        Left
      </button>
      <button class="preset-btn" id="preset-right" title="Right Center">
        <div class="preset-icon"><div class="dot right"></div></div>
        Right
      </button>
    </div>
  </div>



  <a id="shortcut-link" href="#" style="font-size: 11px; color: #888; text-decoration: underline; margin-top: 10px; display: block; text-align: center;">Customize Keyboard Shortcuts</a>
  <script src="popup.js"></script>
</body>
</html>
