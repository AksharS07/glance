<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Island V1.6 - What's New</title>
  <link rel="icon" href="icon128.png" type="image/png">
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 32px;
    }
    .feature {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
      align-items: flex-start;
    }
    .feature-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .feature-icon svg {
      width: 18px;
      height: 18px;
    }
    .icon-settings { background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.2); }
    .icon-settings svg { fill: #a78bfa; }
    .icon-move { background: rgba(96,165,250,0.12); border: 1px solid rgba(96,165,250,0.2); }
    .icon-move svg { fill: #60a5fa; }
    .icon-hide { background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.2); }
    .icon-hide svg { fill: #fbbf24; }
    .icon-lyrics { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.2); }
    .icon-lyrics svg { fill: #34d399; }
    .feature-content h3 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px 0;
    }
    .feature-content p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.55);
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: 600;
      border-radius: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.8;
    }
    .icon-spotify {
      background: rgba(29, 185, 84, 0.1) !important;
    }
    .icon-spotify svg {
      fill: #1DB954 !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dynamic Island V1.6</h1>
    <div class="subtitle">The Polish & Power Update! Added Shuffle/Repeat support for Spotify and Apple Music, Keyboard Shortcuts (Alt+Space/Right/Left), a Teleport toggle to jump between tabs, Quick Playlist shortcuts in the popup, and a much smoother UI.</div>

    <a href="#" id="close-btn" class="btn">Awesome, let's go!</a>
  </div>
  <script>
    document.getElementById('close-btn').addEventListener('click', function(e) {
      e.preventDefault();
      window.close();
      setTimeout(() => { chrome.tabs.query({active: true, currentWindow: true}, tabs => { if(tabs.length) chrome.tabs.remove(tabs[0].id); }); }, 100);
    });
  </script>
</body>
</html>
